server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape tous les containers Docker
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Nom du container
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container_name"

      # Nom du service compose
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "compose_service"

      # Nom du projet compose
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "compose_project"

      # ID du container (court)
      - source_labels: ["__meta_docker_container_id"]
        regex: "(.{12})"
        target_label: "container_id_short"

    pipeline_stages:
      # Parser les logs JSON si présents
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            service: service

      # Extraire le niveau de log des messages texte
      - regex:
          expression: "(?P<level>DEBUG|INFO|WARN|WARNING|ERROR|FATAL)"

      # Créer un label pour le niveau de log
      - labels:
          level:

      # Parser les timestamps
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.999999999Z07:00"
            - "2006-01-02 15:04:05"

  # Scrape logs locaux des microservices Node.js
  - job_name: deepsea-services
    static_configs:
      - targets:
          - localhost
        labels:
          job: deepsea
          service_name: auth
          __path__: /var/log/deepsea/auth-service.log
      - targets:
          - localhost
        labels:
          job: deepsea
          service_name: observation
          __path__: /var/log/deepsea/observation-service.log
      - targets:
          - localhost
        labels:
          job: deepsea
          service_name: taxonomy
          __path__: /var/log/deepsea/taxonomy-service.log
      - targets:
          - localhost
        labels:
          job: deepsea
          service_name: ai
          __path__: /var/log/deepsea/ai-service.log
      - targets:
          - localhost
        labels:
          job: deepsea
          service_name: api-gateway
          __path__: /var/log/deepsea/api-gateway.log
      - targets:
          - localhost
        labels:
          job: deepsea
          service_name: frontend
          __path__: /var/log/deepsea/frontend.log

    pipeline_stages: []
