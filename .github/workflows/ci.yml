name: CI Pipeline - DeepSea Archives

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Job pour l'API Gateway
  api-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/api-gateway

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./services/api-gateway/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Run tests
        run: npm test || echo "No tests configured yet"
        env:
          JWT_SECRET: test_secret_for_ci
          NODE_ENV: test

  # Job pour Auth Service
  auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/auth-service

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: deepsea_auth_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./services/auth-service/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Setup database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/deepsea_auth_test

      - name: ✅ Run tests
        run: npm test
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/deepsea_auth_test
          JWT_SECRET: test_secret_for_ci
          NODE_ENV: test

  # Job pour Observation Service
  observation-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/observation-service

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepsea_observation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./services/observation-service/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Setup database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deepsea_observation_test?schema=public

      - name: ✅ Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deepsea_observation_test?schema=public
          JWT_SECRET: test_secret_for_ci
          NODE_ENV: test

  # Job pour Taxonomy Service
  taxonomy-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/taxonomy-service

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deepsea_taxonomy_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./services/taxonomy-service/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🗄️ Setup database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/deepsea_taxonomy_test?schema=public

      - name: ✅ Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/deepsea_taxonomy_test?schema=public
          JWT_SECRET: test_secret_for_ci
          NODE_ENV: test

  # Job pour le Frontend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./services/frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: npm run build
