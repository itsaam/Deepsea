<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deepsea - Test UI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        color: white;
        text-align: center;
        margin-bottom: 30px;
        font-size: 2.5em;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }
      .section {
        background: white;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #667eea;
        margin-bottom: 15px;
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        color: #333;
        font-weight: 600;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 10px;
        border: 2px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
      }
      textarea {
        resize: vertical;
        min-height: 80px;
      }
      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.3s;
        margin-right: 10px;
      }
      button:hover {
        background: #5568d3;
      }
      button.secondary {
        background: #6c757d;
      }
      button.secondary:hover {
        background: #5a6268;
      }
      button.danger {
        background: #dc3545;
      }
      button.danger:hover {
        background: #c82333;
      }
      .result {
        background: #f8f9fa;
        border-left: 4px solid #667eea;
        padding: 15px;
        margin-top: 15px;
        border-radius: 6px;
        font-family: monospace;
        white-space: pre-wrap;
        word-wrap: break-word;
        max-height: 400px;
        overflow-y: auto;
      }
      .token-display {
        background: #fff3cd;
        border: 1px solid #ffc107;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 15px;
        word-break: break-all;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
      }
      .species-card,
      .observation-card {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        border-left: 4px solid #667eea;
      }
      .species-card h3,
      .observation-card h3 {
        color: #667eea;
        margin-bottom: 10px;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        margin-right: 5px;
      }
      .badge.pending {
        background: #ffc107;
        color: #000;
      }
      .badge.validated {
        background: #28a745;
        color: white;
      }
      .badge.rejected {
        background: #dc3545;
        color: white;
      }
      .badge.expert {
        background: #17a2b8;
        color: white;
      }
      .stats {
        display: flex;
        gap: 15px;
        margin-top: 10px;
      }
      .stat {
        background: white;
        padding: 10px;
        border-radius: 6px;
        text-align: center;
      }
      .stat-value {
        font-size: 24px;
        font-weight: 700;
        color: #667eea;
      }
      .stat-label {
        font-size: 12px;
        color: #6c757d;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🌊 Deepsea Test Interface</h1>

      <!-- Auth Section -->
      <div class="section">
        <h2>🔐 Authentification</h2>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" id="authEmail" placeholder="user@example.com" />
        </div>
        <div class="form-group">
          <label>Username:</label>
          <input type="text" id="authUsername" placeholder="username" />
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" id="authPassword" placeholder="password" />
        </div>
        <button onclick="register()">S'inscrire</button>
        <button onclick="login()" class="secondary">Se connecter</button>
        <div id="tokenDisplay" class="token-display" style="display: none">
          <strong>Token JWT:</strong> <span id="tokenValue"></span>
        </div>
        <div id="authResult" class="result" style="display: none"></div>
      </div>

      <!-- Species Section -->
      <div class="section">
        <h2>🐋 Espèces</h2>
        <div class="form-group">
          <label>Nom de l'espèce:</label>
          <input type="text" id="speciesName" placeholder="Requin Baleine" />
        </div>
        <button onclick="createSpecies()">Créer une espèce</button>
        <button onclick="getSpecies()" class="secondary">
          Voir toutes (récentes)
        </button>
        <button onclick="getSpeciesByRarity()" class="secondary">
          Trier par rareté
        </button>
        <div id="speciesResult" class="result" style="display: none"></div>
      </div>

      <!-- Observations Section -->
      <div class="section">
        <h2>👁️ Observations</h2>
        <div class="form-group">
          <label>Espèce ID:</label>
          <input type="number" id="obsSpeciesId" placeholder="1" />
        </div>
        <div class="form-group">
          <label>Description:</label>
          <textarea
            id="obsDescription"
            placeholder="J'ai observé cette espèce près de..."
          ></textarea>
        </div>
        <button onclick="createObservation()">Créer une observation</button>
        <button onclick="getObservationsBySpecies()" class="secondary">
          Voir observations
        </button>
        <div id="obsResult" class="result" style="display: none"></div>
      </div>

      <!-- Validation Section -->
      <div class="section">
        <h2>✅ Validation</h2>
        <div class="form-group">
          <label>Observation ID:</label>
          <input type="number" id="validationObsId" placeholder="1" />
        </div>
        <button onclick="validateObservation()">Valider</button>
        <button onclick="rejectObservation()" class="danger">Rejeter</button>
        <div id="validationResult" class="result" style="display: none"></div>
      </div>

      <!-- Reputation Section -->
      <div class="section">
        <h2>⭐ Réputation</h2>
        <div class="form-group">
          <label>User ID:</label>
          <input type="number" id="reputationUserId" placeholder="1" />
        </div>
        <button onclick="getUserReputation()">Voir réputation</button>
        <div id="reputationResult" class="result" style="display: none"></div>
      </div>
    </div>

    <script>
      const AUTH_URL = "http://localhost:3001";
      const OBS_URL = "http://localhost:3002";
      let token = localStorage.getItem("token") || "";

      if (token) {
        document.getElementById("tokenDisplay").style.display = "block";
        document.getElementById("tokenValue").textContent =
          token.substring(0, 50) + "...";
      }

      function showResult(elementId, data) {
        const element = document.getElementById(elementId);
        element.style.display = "block";
        element.textContent = JSON.stringify(data, null, 2);
      }

      async function register() {
        const email = document.getElementById("authEmail").value;
        const username = document.getElementById("authUsername").value;
        const password = document.getElementById("authPassword").value;

        try {
          const response = await fetch(`${AUTH_URL}/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, username, password }),
          });
          const data = await response.json();

          if (data.token) {
            token = data.token;
            localStorage.setItem("token", token);
            document.getElementById("tokenDisplay").style.display = "block";
            document.getElementById("tokenValue").textContent =
              token.substring(0, 50) + "...";
          }

          showResult("authResult", data);
        } catch (error) {
          showResult("authResult", { error: error.message });
        }
      }

      async function login() {
        const identifier = document.getElementById("authEmail").value;
        const password = document.getElementById("authPassword").value;

        try {
          const response = await fetch(`${AUTH_URL}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identifier, password }),
          });
          const data = await response.json();

          if (data.token) {
            token = data.token;
            localStorage.setItem("token", token);
            document.getElementById("tokenDisplay").style.display = "block";
            document.getElementById("tokenValue").textContent =
              token.substring(0, 50) + "...";
          }

          showResult("authResult", data);
        } catch (error) {
          showResult("authResult", { error: error.message });
        }
      }

      async function createSpecies() {
        const name = document.getElementById("speciesName").value;

        try {
          const response = await fetch(`${OBS_URL}/species`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ name }),
          });
          const data = await response.json();
          showResult("speciesResult", data);
        } catch (error) {
          showResult("speciesResult", { error: error.message });
        }
      }

      async function getSpecies() {
        try {
          const response = await fetch(`${OBS_URL}/species`);
          const data = await response.json();
          showResult("speciesResult", data);
        } catch (error) {
          showResult("speciesResult", { error: error.message });
        }
      }

      async function getSpeciesByRarity() {
        try {
          const response = await fetch(`${OBS_URL}/species?sortBy=rarity`);
          const data = await response.json();
          showResult("speciesResult", data);
        } catch (error) {
          showResult("speciesResult", { error: error.message });
        }
      }

      async function createObservation() {
        const speciesId = document.getElementById("obsSpeciesId").value;
        const description = document.getElementById("obsDescription").value;

        try {
          const response = await fetch(`${OBS_URL}/observations`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              speciesId: parseInt(speciesId),
              description,
            }),
          });
          const data = await response.json();
          showResult("obsResult", data);
        } catch (error) {
          showResult("obsResult", { error: error.message });
        }
      }

      async function getObservationsBySpecies() {
        const speciesId = document.getElementById("obsSpeciesId").value;

        try {
          const response = await fetch(
            `${OBS_URL}/observations/species/${speciesId}/observations`
          );
          const data = await response.json();
          showResult("obsResult", data);
        } catch (error) {
          showResult("obsResult", { error: error.message });
        }
      }

      async function validateObservation() {
        const obsId = document.getElementById("validationObsId").value;

        try {
          const response = await fetch(
            `${OBS_URL}/observations/${obsId}/validate`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
            }
          );
          const data = await response.json();
          showResult("validationResult", data);
        } catch (error) {
          showResult("validationResult", { error: error.message });
        }
      }

      async function rejectObservation() {
        const obsId = document.getElementById("validationObsId").value;

        try {
          const response = await fetch(
            `${OBS_URL}/observations/${obsId}/reject`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
            }
          );
          const data = await response.json();
          showResult("validationResult", data);
        } catch (error) {
          showResult("validationResult", { error: error.message });
        }
      }

      async function getUserReputation() {
        const userId = document.getElementById("reputationUserId").value;

        try {
          // Pas d'API pour ça encore, mais tu peux l'ajouter
          showResult("reputationResult", {
            message:
              "API de réputation pas encore exposée. Vérifie via Prisma Studio ou les logs.",
          });
        } catch (error) {
          showResult("reputationResult", { error: error.message });
        }
      }
    </script>
  </body>
</html>
