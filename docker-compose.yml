version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: auth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  postgres:
    image: postgres
    environment:
      POSTGRES_USER: saam
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: madb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql://root:password123@mysql:3306/auth_db
      JWT_SECRET: your_jwt_secret_here
      PORT: 3001

  observation-service:
    build: ./services/observation-service
    ports:
      - "3002:3002"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://saam:password123@postgres:5432/madb
      PORT: 3002

volumes:
  mysql-data:
  postgres-data:
